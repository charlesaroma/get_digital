    <!--
      Logo loader styles. They live here, not in src/index.css, so the boot loader is styled
      on the very first paint (in dev, Vite injects index.css from JS). The React
      <LogoLoader /> (src/components/motion/LogoLoader.jsx) reuses these classes.
    -->
    <style>
      html { background: #FCF8F4; }
      html[data-theme="dark"] { background: #0A0B18; }
      .gd-loader { display: grid; place-items: center; color: #171828; background: #FCF8F4; }
      html[data-theme="dark"] .gd-loader { color: #F6F6FC; background: #0A0B18; }
      .gd-loader--screen { position: fixed; inset: 0; z-index: 2147483000; transition: opacity 0.45s ease, visibility 0.45s ease; }
      .gd-loader--screen.is-done { opacity: 0; visibility: hidden; }
      .gd-loader--inline, html[data-theme="dark"] .gd-loader--inline { min-height: min(60vh, 560px); background: transparent; }
      .gd-loader__inner { display: flex; flex-direction: column; align-items: center; gap: clamp(16px, 3vw, 24px); }
      .gd-mark { display: block; width: clamp(88px, 24vw, 132px); height: auto; overflow: visible; }
      .gd-loader--inline .gd-mark { width: clamp(64px, 16vw, 88px); }
      .gd-mark__g, .gd-mark__d, .gd-mark__n { transform-box: fill-box; transform-origin: center; }
      .gd-mark__g { animation: gd-g-in 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
      .gd-mark__d { animation: gd-d-in 0.8s 0.25s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
      .gd-mark__n { animation: gd-n-in 0.4s calc(0.7s + var(--i) * 55ms) cubic-bezier(0.3, 1.5, 0.6, 1) both, gd-n-pulse 1.8s calc(1.5s + var(--i) * 90ms) ease-in-out infinite; }
      .gd-loader__bar { position: relative; width: clamp(96px, 26vw, 148px); height: 3px; border-radius: 999px; overflow: hidden; background: rgba(23, 24, 40, 0.1); }
      html[data-theme="dark"] .gd-loader__bar { background: rgba(246, 246, 252, 0.14); }
      .gd-loader--inline .gd-loader__bar { width: clamp(72px, 18vw, 104px); }
      .gd-loader__bar::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 40%; border-radius: inherit; background: #FAB30D; animation: gd-bar 1.2s ease-in-out infinite; }
      .gd-sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
      @keyframes gd-g-in { from { opacity: 0; transform: rotate(-120deg) scale(0.6); } }
      @keyframes gd-d-in { from { opacity: 0; transform: translateX(22%); } }
      @keyframes gd-n-in { from { opacity: 0; transform: scale(0); } }
      @keyframes gd-n-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
      @keyframes gd-bar { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) {
        .gd-mark__g, .gd-mark__d, .gd-mark__n, .gd-loader__bar::after { animation: none; }
        .gd-loader--screen { transition: none; }
      }
    </style>

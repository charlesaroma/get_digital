# GetDigital256: Nginx site config.
# Install: copy to /etc/nginx/sites-available/gd256.org, link into sites-enabled,
# run `nginx -t` then `systemctl reload nginx`.
# Assumes: the built site (npm run build) in /var/www/gd256/dist,
#          the Express API on 127.0.0.1:5000, Let's Encrypt certificates.

# Old WordPress URLs to new routes. Matched on the original request, so the
# index.html fallback below can never loop.
map $request_uri $gd_redirect {
    default "";
    ~^/learn-ai-on-a-phone/?(\?|$)  /blogs/learn-ai-on-a-phone;
    ~^/ai-skills-ugandan-job-ads/?(\?|$)  /blogs/ai-skills-ugandan-job-ads;
    ~^/ai-for-teachers-in-uganda/?(\?|$)  /blogs/ai-for-teachers-in-uganda;
    ~^/what-to-do-before-job-hunting-in-uganda/?(\?|$)  /blogs/what-to-do-before-job-hunting-in-uganda;
    ~^/(home|index\.(html|php))/?(\?|$)       /;
    ~^/about-us/?(\?|$)                        /about;
    ~^/contact-us/?(\?|$)                      /contact;
    ~^/(blog|category|tag|author|page|feed)(/|\?|$)  /blogs;
    ~^/news(/|\?|$)                            /press;
    ~^/voting/?(\?|$)                          /vote;
    ~^/(ticket|events)/?(\?|$)                 /tickets;
    ~^/free-ai-course/?(\?|$)                  /#free-ai-course;
    ~^/(wp-admin|wp-login\.php)                /;
}

# HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name gd256.org www.gd256.org;
    return 301 https://gd256.org$request_uri;
}

# www to apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.gd256.org;
    ssl_certificate     /etc/letsencrypt/live/gd256.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gd256.org/privkey.pem;
    return 301 https://gd256.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gd256.org;

    ssl_certificate     /etc/letsencrypt/live/gd256.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gd256.org/privkey.pem;

    root  /var/www/gd256/dist;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml
               application/manifest+json application/xml text/xml text/plain;

    if ($gd_redirect) {
        return 301 $gd_redirect;
    }

    # Remove trailing slashes (old WordPress URLs ended with /)
    rewrite ^/(.+)/$ /$1 permanent;

    # API (same origin, as in the Vite dev proxy)
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build files and fonts: cache for a year
    location ~ ^/(assets|fonts)/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # Icons, logos and the share image
    location ~* \.(png|svg|ico|webmanifest|webp|jpg)$ {
        expires 7d;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    # Single page app fallback
    location / {
        try_files $uri /index.html;
    }
}
